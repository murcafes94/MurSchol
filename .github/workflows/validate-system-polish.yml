name: Validate MurSchol System Polish

on:
  push:
    paths:
      - 'desktop/os/live/**'
      - '.github/workflows/validate-system-polish.yml'
  pull_request:
    paths:
      - 'desktop/os/live/**'
      - '.github/workflows/validate-system-polish.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate startup scripts
        run: |
          sh -n desktop/os/live/config/hooks/live/040-plymouth.hook.chroot
          sh -n desktop/os/live/config/hooks/live/050-system-services.hook.chroot
          sh -n desktop/os/live/config/includes.chroot/usr/local/bin/murschol-session
          sh -n desktop/os/live/config/includes.chroot/usr/local/bin/murschol-power-profile
          sh -n desktop/os/live/config/includes.chroot/usr/local/bin/murschol-clipboard
          sh -n desktop/os/live/config/includes.chroot/usr/local/bin/murschol-update
          sh -n desktop/os/live/config/includes.chroot/usr/local/lib/murschol/update-system-root
          sh -n desktop/os/live/config/includes.chroot/etc/skel/.config/labwc/autostart
          bash -n desktop/os/live/build-live.sh
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('desktop/os/live/config/includes.chroot/etc/skel/.config/labwc/rc.xml')"

      - name: Validate MurSchol boot splash
        run: |
          THEME=desktop/os/live/config/includes.chroot/usr/share/plymouth/themes/murschol
          test -s "$THEME/murschol-splash.png"
          test -s "$THEME/murschol.plymouth"
          test -s "$THEME/murschol.script"
          grep -q '^ModuleName=script$' "$THEME/murschol.plymouth"
          grep -q 'murschol-splash.png' "$THEME/murschol.script"
          grep -q '^plymouth$' desktop/os/live/config/package-lists/murschol.list.chroot
          grep -q '^plymouth-themes$' desktop/os/live/config/package-lists/murschol.list.chroot
          grep -q 'quiet splash' desktop/os/live/build-live.sh
          grep -q 'quiet splash' desktop/os/live/config/includes.chroot/etc/default/grub.d/50-murschol.cfg
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path('desktop/os/live/config/includes.chroot/usr/share/plymouth/themes/murschol/murschol-splash.png')
          data = p.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'splash no es PNG'
          width, height = struct.unpack('>II', data[16:24])
          assert width >= 1280 and height >= 720, (width, height)
          print(f'MurSchol splash: {width}x{height}')
          PY

      - name: Validate installed session safety
        run: |
          LIGHTDM=desktop/os/live/config/includes.chroot/etc/lightdm/lightdm.conf.d/50-murschol.conf
          grep -q '^user-session=murschol$' "$LIGHTDM"
          ! grep -q '^autologin-user=user$' "$LIGHTDM"
          grep -q '^PRETTY_NAME="MurSchol OS 0.1"$' desktop/os/live/config/includes.chroot/etc/os-release
          grep -q '^power-profiles-daemon$' desktop/os/live/config/package-lists/murschol.list.chroot
          grep -q '^flatpak$' desktop/os/live/config/package-lists/murschol.list.chroot
          grep -q '^gvfs-backends$' desktop/os/live/config/package-lists/murschol.list.chroot
          grep -q '^thunar-volman$' desktop/os/live/config/package-lists/murschol.list.chroot
          grep -q '^ntfs-3g$' desktop/os/live/config/package-lists/murschol.list.chroot
          grep -q '^exfatprogs$' desktop/os/live/config/package-lists/murschol.list.chroot
          grep -q 'murschol-power-profile.path' desktop/os/live/config/includes.chroot/etc/skel/.config/labwc/autostart
          grep -q 'PathChanged=%h/.config/murschol/settings.ini' desktop/os/live/config/includes.chroot/usr/lib/systemd/user/murschol-power-profile.path

      - name: Validate suspend clipboard and updates
        run: |
          PACKAGES=desktop/os/live/config/package-lists/murschol.list.chroot
          AUTOSTART=desktop/os/live/config/includes.chroot/etc/skel/.config/labwc/autostart
          RC=desktop/os/live/config/includes.chroot/etc/skel/.config/labwc/rc.xml
          UPDATE=desktop/os/live/config/includes.chroot/usr/local/bin/murschol-update
          ROOT_UPDATE=desktop/os/live/config/includes.chroot/usr/local/lib/murschol/update-system-root

          grep -q '^swayidle$' "$PACKAGES"
          grep -q '^cliphist$' "$PACKAGES"
          grep -q '^wofi$' "$PACKAGES"
          grep -q '^pkexec$' "$PACKAGES"
          grep -q 'cliphist wipe' "$AUTOSTART"
          grep -q 'wl-paste --type text --watch cliphist store' "$AUTOSTART"
          grep -q "before-sleep '/usr/local/bin/murschol-lock'" "$AUTOSTART"
          grep -q 'thunar --daemon' "$AUTOSTART"
          grep -q 'key="W-v"' "$RC"
          grep -q 'key="W-S-u"' "$RC"
          grep -q 'key="XF86Sleep"' "$RC"

          grep -q '/run/live/medium' "$UPDATE"
          grep -q '^if pkexec /usr/local/lib/murschol/update-system-root; then$' "$UPDATE"
          grep -q 'apt-get -y --with-new-pkgs upgrade' "$ROOT_UPDATE"
          if grep -Eq '^[[:space:]]*apt-get[[:space:]].*autoremove' "$ROOT_UPDATE"; then
            echo 'No se permite autoremove automático en MurSchol Update.' >&2
            exit 1
          fi
          test -f desktop/os/live/config/includes.chroot/usr/share/applications/murschol-update.desktop
          grep -q '^Exec=/usr/local/bin/murschol-update$' desktop/os/live/config/includes.chroot/usr/share/applications/murschol-update.desktop
          test -f desktop/os/live/config/includes.chroot/etc/skel/.config/wofi/style.css

      - name: Validate memory power and time polish
        run: |
          PACKAGES=desktop/os/live/config/package-lists/murschol.list.chroot
          AUTOSTART=desktop/os/live/config/includes.chroot/etc/skel/.config/labwc/autostart
          SESSION=desktop/os/live/config/includes.chroot/usr/local/bin/murschol-session
          SERVICES=desktop/os/live/config/hooks/live/050-system-services.hook.chroot
          ZRAM=desktop/os/live/config/includes.chroot/etc/systemd/zram-generator.conf
          GREETER=desktop/os/live/config/includes.chroot/etc/lightdm/lightdm-gtk-greeter.conf.d/50-murschol.conf

          grep -q '^systemd-timesyncd$' "$PACKAGES"
          grep -q '^systemd-zram-generator$' "$PACKAGES"
          grep -q '^wlopm$' "$PACKAGES"
          grep -q 'systemctl enable systemd-timesyncd.service' "$SERVICES"
          grep -q 'systemctl enable fstrim.timer' "$SERVICES"
          grep -q '^\[zram0\]$' "$ZRAM"
          grep -q '^zram-size = min(ram / 2, 4096)$' "$ZRAM"
          grep -q "timeout 300 'wlopm --off \\\*'" "$AUTOSTART"
          grep -q "after-resume 'wlopm --on \\\*'" "$AUTOSTART"
          grep -q '"$HOME/Plantillas"' "$SESSION"
          grep -q '"$HOME/Público"' "$SESSION"
          grep -q '^background=#15191e$' "$GREETER"
          grep -q '^theme-name=Adwaita-dark$' "$GREETER"

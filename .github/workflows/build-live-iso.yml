name: Build MurSchol Live ISO

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/os/live/**'
      - 'desktop/os/shell/**'
      - '.github/workflows/build-live-iso.yml'

permissions:
  contents: read

jobs:
  build-live-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Liberar espacio del runner
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/dotnet || true
          df -h

      - name: Instalar herramientas de live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio debootstrap xorriso squashfs-tools \
            dosfstools mtools syslinux-utils isolinux curl

          # Ubuntu 24.04 todavía distribuye un live-build antiguo que genera
          # la ruta de seguridad obsoleta "trixie/updates". Para construir
          # Debian 13 usamos el paquete oficial actual de Trixie y verificamos
          # su SHA-256 antes de instalarlo.
          curl -fsSL \
            https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb \
            -o /tmp/live-build.deb
          echo "58e09779881cbcc631c49ceb703413e0247a87db01823e597b2a1c40a2afd8f4  /tmp/live-build.deb" | sha256sum -c -
          sudo dpkg -i /tmp/live-build.deb
          lb --version

      - name: Validar scripts
        run: |
          bash -n desktop/os/live/build-live.sh
          sh -n desktop/os/live/config/hooks/live/010-build-murschol.hook.chroot
          sh -n desktop/os/live/config/includes.chroot/usr/local/bin/murschol-session
          sh -n desktop/os/live/config/includes.chroot/etc/skel/.config/labwc/autostart

      - name: Construir MurSchol OS Live 0.1
        run: sudo ./desktop/os/live/build-live.sh

      - name: Verificar ISO
        run: |
          ls -lh desktop/os/live/MurSchol-OS-0.1-Live-amd64.iso*
          cd desktop/os/live
          sha256sum -c MurSchol-OS-0.1-Live-amd64.iso.sha256

      - name: Publicar ISO de prueba
        uses: actions/upload-artifact@v4
        with:
          name: MurSchol-OS-0.1-Live-amd64
          path: |
            desktop/os/live/MurSchol-OS-0.1-Live-amd64.iso
            desktop/os/live/MurSchol-OS-0.1-Live-amd64.iso.sha256
          compression-level: 0
          retention-days: 14

name: Build MurSchol Desktop

on:
  push:
    paths:
      - 'desktop/os/shell/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-declarative-dev libxkbcommon-dev

      - name: Configure
        run: cmake -S desktop/os/shell -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/desktop --parallel

      - name: Install staging tree
        run: cmake --install build/desktop --prefix dist/murschol-desktop

      - name: Package
        run: tar -C dist -czf MurSchol-Desktop-0.2-linux-x86_64.tar.gz murschol-desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MurSchol-Desktop-0.2-linux-x86_64
          path: MurSchol-Desktop-0.2-linux-x86_64.tar.gz
          retention-days: 30

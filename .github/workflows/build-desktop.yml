name: Build MurSchol Desktop

on:
  push:
    paths:
      - 'desktop/os/shell/**'
      - 'desktop/apps/reader/**'
      - 'desktop/apps/photos/**'
      - 'desktop/apps/media/**'
      - 'desktop/apps/music/**'
      - 'desktop/apps/calendar/**'
      - 'desktop/apps/capture/**'
      - 'desktop/apps/calculator/**'
      - 'desktop/apps/settings/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qml6-module-qtquick-window libxkbcommon-dev qml6-module-qtquick-dialogs

      - name: Configure
        run: cmake -S desktop/os/shell -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/desktop --parallel

      - name: Test quick controls without hardware
        run: |
          /usr/lib/qt6/libexec/moc desktop/os/shell/src/QuickControlsBackend.h -o /tmp/moc-quick-controls.cpp
          c++ -std=c++17 -fPIC -Idesktop/os/shell/src \
            desktop/os/shell/tests/quick_controls.cpp \
            desktop/os/shell/src/QuickControlsBackend.cpp /tmp/moc-quick-controls.cpp \
            $(pkg-config --cflags --libs Qt6Core) -o /tmp/test-quick-controls
          /tmp/test-quick-controls

      - name: Install staging tree
        run: cmake --install build/desktop --prefix dist/murschol-desktop

      - name: Package
        run: tar -C dist -czf MurSchol-Desktop-0.3.0-linux-x86_64.tar.gz murschol-desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MurSchol-Desktop-0.3.0-linux-x86_64
          path: MurSchol-Desktop-0.3.0-linux-x86_64.tar.gz
          retention-days: 30

  validate-reader:
    name: Validar MurSchol Reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qml6-module-qtquick-window

      - name: Validar QML y compilar Reader
        run: |
          set -eu
          for qml in \
            desktop/apps/reader/qml/Main.qml \
            desktop/apps/reader/qml/components/ReaderTopBar.qml \
            desktop/apps/reader/qml/components/ContentsDrawer.qml \
            desktop/apps/reader/qml/components/MarksDrawer.qml \
            desktop/apps/reader/qml/components/LibraryHome.qml; do
            /usr/lib/qt6/bin/qmlformat "$qml" >/dev/null
          done

          cmake -S desktop/apps/reader -B build/reader -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/reader --parallel
          test -x build/reader/murschol-reader

  validate-photos:
    name: Validar MurSchol Photos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qml6-module-qtquick-window

      - name: Validar QML y compilar Photos
        run: |
          set -eu
          /usr/lib/qt6/bin/qmlformat desktop/apps/photos/qml/Main.qml >/dev/null
          cmake -S desktop/apps/photos -B build/photos -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/photos --parallel
          test -x build/photos/murschol-photos

  validate-media:
    name: Validar MurSchol Media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Qt 6 y libmpv
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qml6-module-qtquick-window \
            libmpv-dev libgl1-mesa-dev

      - name: Validar QML y compilar Media
        run: |
          set -eu
          /usr/lib/qt6/bin/qmlformat desktop/apps/media/qml/Main.qml >/dev/null
          cmake -S desktop/apps/media -B build/media -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/media --parallel
          test -x build/media/murschol-media
          code=0
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software timeout 6 \
            build/media/murschol-media > /tmp/media-startup.log 2>&1 || code=$?
          cat /tmp/media-startup.log
          test "$code" -eq 124
          if grep -Eq 'QQmlApplicationEngine failed|ReferenceError:|TypeError:|module .* is not installed' /tmp/media-startup.log; then
            exit 1
          fi

  validate-music:
    name: Validar MurSchol Music
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Qt 6 y TagLib
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qml6-module-qtquick-window \
            libtag1-dev

      - name: Validar QML y compilar Music
        run: |
          set -eu
          /usr/lib/qt6/bin/qmlformat desktop/apps/music/qml/Main.qml >/dev/null
          cmake -S desktop/apps/music -B build/music -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/music --parallel
          test -x build/music/murschol-music
          code=0
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software timeout 6 \
            build/music/murschol-music > /tmp/music-startup.log 2>&1 || code=$?
          cat /tmp/music-startup.log
          test "$code" -eq 124
          if grep -Eq 'QQmlApplicationEngine failed|ReferenceError:|TypeError:|module .* is not installed' /tmp/music-startup.log; then
            exit 1
          fi

  validate-calendar:
    name: Validar MurSchol Calendar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias Qt 6 y SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qml6-module-qtquick-window libqt6sql6-sqlite

      - name: Validar QML y compilar Calendar
        run: |
          set -eu
          /usr/lib/qt6/bin/qmlformat desktop/apps/calendar/qml/Main.qml >/dev/null
          cmake -S desktop/apps/calendar -B build/calendar -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/calendar --parallel
          test -x build/calendar/murschol-calendar
          code=0
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software timeout 6 \
            build/calendar/murschol-calendar > /tmp/calendar-startup.log 2>&1 || code=$?
          cat /tmp/calendar-startup.log
          test "$code" -eq 124
          if grep -Eq 'QQmlApplicationEngine failed|ReferenceError:|TypeError:|module .* is not installed' /tmp/calendar-startup.log; then
            exit 1
          fi

  validate-capture:
    name: Validar MurSchol Capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qml6-module-qtquick-window

      - name: Validar QML y compilar Capture
        run: |
          set -eu
          /usr/lib/qt6/bin/qmlformat desktop/apps/capture/qml/Main.qml >/dev/null
          cmake -S desktop/apps/capture -B build/capture -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/capture --parallel
          test -x build/capture/murschol-capture
          code=0
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software timeout 6 \
            build/capture/murschol-capture > /tmp/capture-startup.log 2>&1 || code=$?
          cat /tmp/capture-startup.log
          test "$code" -eq 124
          if grep -Eq 'QQmlApplicationEngine failed|ReferenceError:|TypeError:|module .* is not installed' /tmp/capture-startup.log; then
            exit 1
          fi

  validate-calculator:
    name: Validar MurSchol Calculator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Qt 6 y libqalculate
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qml6-module-qtquick-window \
            libqalculate-dev

      - name: Validar QML y compilar Calculator
        run: |
          set -eu
          /usr/lib/qt6/bin/qmlformat desktop/apps/calculator/qml/Main.qml >/dev/null
          cmake -S desktop/apps/calculator -B build/calculator -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/calculator --parallel
          test -x build/calculator/murschol-calculator
          code=0
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software timeout 6 \
            build/calculator/murschol-calculator > /tmp/calculator-startup.log 2>&1 || code=$?
          cat /tmp/calculator-startup.log
          test "$code" -eq 124
          if grep -Eq 'QQmlApplicationEngine failed|ReferenceError:|TypeError:|module .* is not installed' /tmp/calculator-startup.log; then
            exit 1
          fi

  validate-settings:
    name: Validar MurSchol Settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qml6-module-qtquick-window

      - name: Validar QML y compilar Settings
        run: |
          set -eu
          /usr/lib/qt6/bin/qmlformat desktop/apps/settings/qml/Main.qml >/dev/null
          cmake -S desktop/apps/settings -B build/settings -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/settings --parallel
          test -x build/settings/murschol-settings

  validate-debian-panel:
    name: Validar panel global en Debian 13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar MurSchol Desktop + panel en Debian Trixie
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            debian:trixie-slim \
            sh -lc '
              set -eu
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates cmake ninja-build g++ \
                qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qml6-module-qtquick-window \
                liblayershellqtinterface-dev layer-shell-qt

              # qmlformat analiza el archivo antes de compilar. No escribimos el
              # resultado; solo queremos detectar errores de sintaxis en el panel
              # y en las superficies principales que se comparten con él.
              for qml in \
                desktop/os/shell/qml/Panel.qml \
                desktop/os/shell/qml/components/Dock.qml \
                desktop/os/shell/qml/components/StartMenu.qml \
                desktop/os/shell/qml/components/SystemCenter.qml \
                desktop/os/shell/qml/components/AppManagerPanel.qml; do
                /usr/lib/qt6/bin/qmlformat "$qml" >/dev/null
              done

              cmake -S desktop/os/shell -B build/panel-debian -G Ninja -DCMAKE_BUILD_TYPE=Release
              cmake --build build/panel-debian --parallel "$(nproc)"
              test -x build/panel-debian/murschol-desktop
              test -x build/panel-debian/murschol-panel
            '

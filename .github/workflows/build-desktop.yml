name: Build MurSchol Desktop

on:
  push:
    paths:
      - 'desktop/os/shell/**'
      - 'desktop/apps/reader/**'
      - 'desktop/apps/photos/**'
      - 'desktop/apps/media/**'
      - 'desktop/apps/music/**'
      - 'desktop/apps/calendar/**'
      - 'desktop/apps/capture/**'
      - 'desktop/apps/calculator/**'
      - 'desktop/apps/settings/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  validate-reader:
    name: Build MurSchol Reader for Linux Mint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ dpkg-dev \
            qt6-base-dev qt6-declarative-dev qt6-pdf-dev \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtqml-workerscript \
            qml6-module-qtquick-window qml6-module-qtquick-templates \
            qml6-module-qtqml qml6-module-qtquick-dialogs qml6-module-qtpdf

      - name: Validar QML, compilar y probar instalación
        run: |
          set -eux
          for qml in \
            desktop/apps/reader/qml/Main.qml \
            desktop/apps/reader/qml/components/ReaderTopBar.qml \
            desktop/apps/reader/qml/components/ContentsDrawer.qml \
            desktop/apps/reader/qml/components/MarksDrawer.qml \
            desktop/apps/reader/qml/components/LibraryHome.qml; do
            /usr/lib/qt6/bin/qmlformat "$qml" >/dev/null
          done
          cmake -S desktop/apps/reader -B build/reader -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/reader --parallel
          test -x build/reader/murschol-reader
          DESTDIR="$PWD/build/reader/stage" cmake --install build/reader
          test -x build/reader/stage/usr/bin/murschol-reader
          test -f build/reader/stage/usr/share/applications/murschol-reader.desktop

      - name: Prueba de arranque sin pantalla
        run: |
          set -eu
          code=0
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software timeout 6 \
            build/reader/murschol-reader >/tmp/reader-startup.log 2>&1 || code=$?
          cat /tmp/reader-startup.log
          test "$code" -eq 124
          if grep -Eq 'QQmlApplicationEngine failed|ReferenceError:|TypeError:|module .* is not installed|Cannot assign to non-existent property' /tmp/reader-startup.log; then
            exit 1
          fi

      - name: Crear paquete DEB
        run: |
          cd build/reader
          cpack -G DEB
          test -n "$(find . -maxdepth 1 -name '*.deb' -print -quit)"
          dpkg-deb --info ./*.deb
          dpkg-deb --contents ./*.deb

      - name: Publicar MurSchol Reader para Mint
        uses: actions/upload-artifact@v4
        with:
          name: MurSchol-Reader-1.0.0-Linux-Mint-amd64
          path: build/reader/*.deb
          if-no-files-found: error
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml libxkbcommon-dev qml6-module-qtquick-dialogs
      - name: Configure
        run: cmake -S desktop/os/shell -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/desktop --parallel
      - name: Test quick controls without hardware
        run: |
          /usr/lib/qt6/libexec/moc desktop/os/shell/src/QuickControlsBackend.h -o /tmp/moc-quick-controls.cpp
          c++ -std=c++17 -fPIC -Idesktop/os/shell/src desktop/os/shell/tests/quick_controls.cpp desktop/os/shell/src/QuickControlsBackend.cpp /tmp/moc-quick-controls.cpp $(pkg-config --cflags --libs Qt6Core) -o /tmp/test-quick-controls
          /tmp/test-quick-controls
      - name: Install staging tree
        run: cmake --install build/desktop --prefix dist/murschol-desktop
      - name: Package
        run: tar -C dist -czf MurSchol-Desktop-0.3.0-linux-x86_64.tar.gz murschol-desktop
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MurSchol-Desktop-0.3.0-linux-x86_64
          path: MurSchol-Desktop-0.3.0-linux-x86_64.tar.gz
          retention-days: 30

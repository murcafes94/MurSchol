name: Build MurSchol Desktop

on:
  push:
    paths:
      - 'desktop/os/shell/**'
      - 'desktop/apps/reader/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-declarative-dev libxkbcommon-dev qml6-module-qtquick-dialogs

      - name: Configure
        run: cmake -S desktop/os/shell -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/desktop --parallel

      - name: Install staging tree
        run: cmake --install build/desktop --prefix dist/murschol-desktop

      - name: Package
        run: tar -C dist -czf MurSchol-Desktop-0.3.0-linux-x86_64.tar.gz murschol-desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MurSchol-Desktop-0.3.0-linux-x86_64
          path: MurSchol-Desktop-0.3.0-linux-x86_64.tar.gz
          retention-days: 30

  validate-reader:
    name: Validar MurSchol Reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-declarative-dev

      - name: Validar QML y compilar Reader
        run: |
          set -eu
          for qml in \
            desktop/apps/reader/qml/Main.qml \
            desktop/apps/reader/qml/components/ReaderTopBar.qml \
            desktop/apps/reader/qml/components/ContentsDrawer.qml \
            desktop/apps/reader/qml/components/MarksDrawer.qml \
            desktop/apps/reader/qml/components/LibraryHome.qml; do
            /usr/lib/qt6/bin/qmlformat "$qml" >/dev/null
          done

          cmake -S desktop/apps/reader -B build/reader -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/reader --parallel
          test -x build/reader/murschol-reader

  validate-debian-panel:
    name: Validar panel global en Debian 13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar MurSchol Desktop + panel en Debian Trixie
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            debian:trixie-slim \
            sh -lc '
              set -eu
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates cmake ninja-build g++ \
                qt6-base-dev qt6-declarative-dev \
                liblayershellqtinterface-dev layer-shell-qt

              # qmlformat analiza el archivo antes de compilar. No escribimos el
              # resultado; solo queremos detectar errores de sintaxis en el panel
              # y en las superficies principales que se comparten con él.
              for qml in \
                desktop/os/shell/qml/Panel.qml \
                desktop/os/shell/qml/components/Dock.qml \
                desktop/os/shell/qml/components/StartMenu.qml \
                desktop/os/shell/qml/components/SystemCenter.qml \
                desktop/os/shell/qml/components/AppManagerPanel.qml; do
                /usr/lib/qt6/bin/qmlformat "$qml" >/dev/null
              done

              cmake -S desktop/os/shell -B build/panel-debian -G Ninja -DCMAKE_BUILD_TYPE=Release
              cmake --build build/panel-debian --parallel "$(nproc)"
              test -x build/panel-debian/murschol-desktop
              test -x build/panel-debian/murschol-panel
            '
